# Environment for the "Cell-cell communication at single-cell resolution" tutorial.
#
#   conda env create -f env.yml
#   conda activate sc-ccc-tutorial
#
# Versions are pinned to the set the notebooks were built and tested against.
name: sc-ccc-tutorial
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      # LIANA+ 2.0.0 is not on PyPI yet; install from main.
      - liana @ git+https://github.com/scverse/liana-py
      - scanpy==1.12.4
      - squidpy==1.8.3
      - anndata==0.13.3.post0
      - plotnine==0.15.0
      - seaborn==0.13.2
      - matplotlib==3.11.1
      - numpy==2.5.3
      - scipy==1.18.1
      - pandas==3.0.5
      - scikit-learn==1.9.0
      - statsmodels==0.15.0
      - numba==0.67.0
      - h5py==3.16.0
      - tqdm==4.70.0
      - omnipath==1.0.12
      - scverse-misc==0.1.4
      - jupyterlab
