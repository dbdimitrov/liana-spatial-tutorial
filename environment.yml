# Environment for the LIANA+ cell-cell communication tutorials (spot/ and image/).
#
#   conda env create -f environment.yml
#   conda activate sc-ccc-tutorial
#
# Versions are pinned to the set the notebooks were built and tested against.
name: sc-ccc-tutorial
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - git
  - pip:
      # LIANA+ 2.0.0 is not on PyPI yet; install the V2.0.0 tag from GitHub.
      - liana @ git+https://github.com/scverse/liana-py@V2.0.0
      - scanpy==1.12.4
      - squidpy==1.8.3
      - anndata==0.13.3.post0
      - mudata==0.4.1
      - decoupler==2.2.0
      - plotnine==0.15.8
      - seaborn==0.13.2
      - matplotlib==3.11.1
      - numpy==2.5.3
      - scipy==1.18.1
      - pandas==3.0.5
      - scikit-learn==1.9.0
      - statsmodels==0.15.0
      - numba==0.67.0
      - h5py==3.16.0
      - tqdm==4.70.0
      - omnipath==1.0.12
      - scverse-misc==0.1.4
      - jupyterlab
      - ipykernel
